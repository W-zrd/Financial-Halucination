name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tradingagents-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose config --quiet
        env:
          WEB_USERNAME: ci
          WEB_PASSWORD: ci-only-password
          WEB_SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters
      - run: docker build --tag "tradingagents-web:sha-${GITHUB_SHA}" .

  package:
    if: github.event_name == 'push'
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag "tradingagents-web:${IMAGE_TAG}" .
      - run: docker save "tradingagents-web:${IMAGE_TAG}" | gzip -1 > tradingagents-web.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tradingagents-web-${{ github.sha }}
          path: tradingagents-web.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://finance.rfdhaikal-wizz.com
    concurrency:
      group: tradingagents-production
      cancel-in-progress: false
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tradingagents-web-${{ github.sha }}
      - name: Configure pinned SSH trust
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transfer release
        run: |
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" tradingagents-web.tar.gz docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          tar -czf tradingagents-scripts.tar.gz scripts
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" tradingagents-scripts.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
      - name: Deploy with rollback
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; install -d /opt/tradingagents/scripts /opt/tradingagents/results; cp /tmp/docker-compose.yml /opt/tradingagents/docker-compose.yml; tar -xzf /tmp/tradingagents-scripts.tar.gz -C /opt/tradingagents; docker load < /tmp/tradingagents-web.tar.gz; cd /opt/tradingagents; chmod +x scripts/*.sh; ./scripts/deploy.sh 'tradingagents-web:${IMAGE_TAG}'; rm -f /tmp/tradingagents-web.tar.gz /tmp/tradingagents-scripts.tar.gz /tmp/docker-compose.yml"
      - name: Public HTTPS smoke
        if: vars.PUBLIC_SMOKE_ENABLED == 'true'
        run: curl --fail --retry 6 --retry-delay 5 --silent --show-error https://finance.rfdhaikal-wizz.com/api/health
